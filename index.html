<body>
    <h1>Személyes Pénzügyi Tervező</h1>
    <main>
        <div id="kulso-div">
            <h2>Üdvözöljük!</h2>
            <p>Kérjük jelentkezzen be</p>
            <form action="./php/main.php" method="post">
                <div id="input-div">
                    <div>
                        <label for="nev">Neve: </label>
                        <input type="text" name="nev" id="nev" required>

                    <div>
                        <label for="pass">Jelszava: </label>
                        <input type="password" name="pass" id="pass" required>

                <button type="submit">Bejelentkezés</button>
            </form>
        </div>
    </main>
